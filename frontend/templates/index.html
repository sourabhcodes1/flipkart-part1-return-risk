<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Support Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
        }

        header {
            background: #2874f0;
            color: white;
            padding: 22px 40px;
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #2874f0;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2874f0;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1765df;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .answer {
            margin-top: 25px;
            padding: 20px;
            border-left: 5px solid #2874f0;
            background: #f8faff;
            border-radius: 8px;
            display: none;
        }

        .answer strong {
            display: block;
            margin-bottom: 8px;
            color: #222;
        }

        #loading {
            display: none;
            margin-top: 15px;
            text-align: center;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    Flipkart Support Assistant
</header>

<div class="container">
    <div class="card">

        <h1>AI Support Assistant</h1>

        <p class="subtitle">
            Ask questions about returns, refunds, exchanges and product policies.
        </p>

        <textarea
            id="question"
            placeholder="Example: What is the exchange policy?"
        ></textarea>

        <button id="askButton" onclick="askQuestion()">
            Ask Question
        </button>

        <div id="loading">
            Processing your question...
        </div>

        <div id="answerBox" class="answer">
            <strong>Assistant:</strong>
            <span id="answer"></span>
        </div>

    </div>
</div>

<script>
async function askQuestion() {

    const question = document.getElementById("question").value.trim();
    const button = document.getElementById("askButton");
    const loading = document.getElementById("loading");
    const answerBox = document.getElementById("answerBox");
    const answer = document.getElementById("answer");

    if (!question) {
        alert("Please enter a question.");
        return;
    }

    button.disabled = true;
    loading.style.display = "block";
    answerBox.style.display = "none";

    try {

        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        if (response.ok) {
            answer.textContent = data.answer || "No answer received.";
        } else {
            answer.textContent = data.answer || "Something went wrong.";
        }

        answerBox.style.display = "block";

    } catch (error) {

        answer.textContent =
            "Unable to connect to the backend. Please make sure the server is running.";

        answerBox.style.display = "block";

    } finally {

        button.disabled = false;
        loading.style.display = "none";
    }
}
</script>

</body>
</html>
